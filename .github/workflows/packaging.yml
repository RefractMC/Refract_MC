name: Packaging Checks

on:
  pull_request:
    paths:
      - '.gitattributes'
      - '.github/workflows/packaging.yml'
      - '.github/workflows/update-package-manifests.yml'
      - 'packaging/scripts/update-packages.py'
      - 'packaging/scripts/pnpm-deps.nix'
      - 'packaging/scripts/test_nix_integration.py'
      - 'nix/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - 'apps/*/package.json'
      - 'packages/*/package.json'
      - 'apps/tauri/src-tauri/Cargo.toml'
      - 'apps/tauri/src-tauri/Cargo.lock'
      - 'apps/tauri/src-tauri/tauri*.json'
  # Every main push builds the package, so source-only changes that break the
  # Nix sandbox (for example, tests that need network access) surface after one
  # merge without making every pull request wait for the full Nix build.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packaging:
    name: Nix Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Configure build temporary directory
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate metadata dependency helper with Nix
        env:
          REFRACT_NIX_INTEGRATION: '1'
        run: python3 -B packaging/scripts/test_nix_integration.py
      - name: Check flake evaluation
        run: nix flake check --no-update-lock-file
      - name: Evaluate Linux ARM package
        run: nix eval --raw --no-update-lock-file .#packages.aarch64-linux.refract.drvPath
      - name: Build Linux x64 package
        run: nix build --no-link --print-build-logs --no-update-lock-file .#refract
