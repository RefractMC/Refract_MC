name: Release (Tauri)

# Push a release tag to prepare a complete draft. Publication stays manual.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.1.4)"
        required: true

# Build jobs only read the repository. Write access is granted to `finalize`,
# the only job that creates the draft and uploads assets.
permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    env:
      # `secrets` isn't allowed in step-level `if`, so surface presence flags here.
      HAS_AZURE_SIGNING: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: ""
          - name: macOS Apple Silicon
            platform: macos-latest
            args: ""
          - name: macOS Intel
            platform: macos-15-intel
            args: ""
          - name: Linux x64
            platform: ubuntu-22.04
            args: ""
    steps:
      - uses: actions/checkout@v7
        with:
          # Manual recovery runs must build the requested release tag, even
          # when the workflow itself is dispatched from a repair branch.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # No Rust cache: a tag run cannot restore caches saved under another tag,
      # so v1.5.0 missed on every platform and still uploaded 0.5-0.6 GB each.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # XProtect's behavioral scanner intermittently locks the DMG staging dir,
      # making `hdiutil create` fail with "Resource busy" — see
      # https://github.com/actions/runner-images/issues/7522
      - name: Stop XProtect (hdiutil "Resource busy" workaround)
        if: runner.os == 'macOS'
        run: |
          sudo pkill -9 XProtect >/dev/null 2>&1 || true
          while pgrep XProtect >/dev/null; do sleep 3; done

      # OS code signing — both steps are no-ops until the corresponding secrets
      # exist, so releases stay unsigned-but-working before the accounts are set
      # up. See apps/tauri/RELEASING.md § "OS code signing & notarization".
      - name: Enable Windows code signing (Azure Trusted Signing)
        if: runner.os == 'Windows' && env.HAS_AZURE_SIGNING == 'true'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          cargo install trusted-signing-cli --locked
          # The endpoint/account/profile are account-specific, so the signCommand
          # overlay is generated here instead of living in tauri.conf.json.
          $overlay = @{ bundle = @{ windows = @{ signCommand = "trusted-signing-cli -e $env:AZURE_SIGNING_ENDPOINT -a $env:AZURE_SIGNING_ACCOUNT -c $env:AZURE_SIGNING_PROFILE %1" } } } | ConvertTo-Json -Depth 5
          Set-Content -Path "apps/tauri/src-tauri/tauri.codesign.conf.json" -Value $overlay -Encoding utf8
          "TAURI_SIGN_ARGS=--config src-tauri/tauri.codesign.conf.json" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # trusted-signing-cli reads these at sign time (invoked by the build step)
          "AZURE_TENANT_ID=$env:AZURE_TENANT_ID" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AZURE_CLIENT_ID=$env:AZURE_CLIENT_ID" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AZURE_CLIENT_SECRET=$env:AZURE_CLIENT_SECRET" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Enable macOS code signing & notarization
        if: runner.os == 'macOS' && env.HAS_APPLE_SIGNING == 'true'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Exported via GITHUB_ENV (not set directly on the build step) so that
        # tauri's bundler never sees empty-string APPLE_* vars when the secrets
        # are absent — it treats "set but empty" as "try to sign" and fails.
        run: |
          {
            printf 'APPLE_CERTIFICATE<<EOF_REFRACT\n%s\nEOF_REFRACT\n' "$CERT"
            printf 'APPLE_CERTIFICATE_PASSWORD<<EOF_REFRACT\n%s\nEOF_REFRACT\n' "$CERT_PASSWORD"
            printf 'APPLE_SIGNING_IDENTITY<<EOF_REFRACT\n%s\nEOF_REFRACT\n' "$IDENTITY"
            printf 'APPLE_ID<<EOF_REFRACT\n%s\nEOF_REFRACT\n' "$NOTARY_ID"
            printf 'APPLE_PASSWORD<<EOF_REFRACT\n%s\nEOF_REFRACT\n' "$NOTARY_PASSWORD"
            printf 'APPLE_TEAM_ID<<EOF_REFRACT\n%s\nEOF_REFRACT\n' "$TEAM_ID"
          } >> "$GITHUB_ENV"

      - name: Build signed bundles
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          # No GITHUB_TOKEN: without tagName/releaseId, tauri-action skips every
          # GitHub upload and never reads it.
          # Repo secrets — Settings → Secrets and variables → Actions:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Baked into the Rust binary at compile time via option_env! in analytics.rs.
          # Without this, analytics stays inert in released Tauri builds.
          GA_API_SECRET: ${{ secrets.GA_API_SECRET }}
          # Baked into the Rust binary at compile time via option_env! in config.rs.
          # User-provided Settings keys still override this for local testing.
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        with:
          projectPath: apps/tauri
          # Build locally. Only the finalizer uploads GitHub release assets.
          uploadUpdaterJson: false
          args: ${{ matrix.args }} ${{ env.TAURI_SIGN_ARGS }}

      - name: Verify the canonical executable name
        shell: bash
        run: |
          BUNDLE="apps/tauri/src-tauri/target/release/bundle"
          case "${{ runner.os }}" in
            Windows)
              test -f apps/tauri/src-tauri/target/release/refract.exe
              ;;
            macOS)
              test -x "$BUNDLE"/macos/Refract.app/Contents/MacOS/refract
              ;;
            Linux)
              deb_files=("$BUNDLE"/deb/*.deb)
              appimage_files=("$BUNDLE"/appimage/*.AppImage)
              test "${#deb_files[@]}" -eq 1
              test "${#appimage_files[@]}" -eq 1
              dpkg-deb -c "${deb_files[0]}" > "$RUNNER_TEMP/refract-deb-contents.txt"
              grep -qE ' (\./)?usr/bin/refract$' "$RUNNER_TEMP/refract-deb-contents.txt"
              appimage=$(realpath "${appimage_files[0]}")
              chmod +x "$appimage"
              extract_dir=$(mktemp -d "$RUNNER_TEMP/refract-appimage.XXXXXX")
              trap 'rm -rf "$extract_dir"' EXIT
              (cd "$extract_dir" && "$appimage" --appimage-extract usr/bin/refract >/dev/null)
              test -x "$extract_dir/squashfs-root/usr/bin/refract"
              ;;
          esac

      - name: Stage canonical release files
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          BUNDLE="apps/tauri/src-tauri/target/release/bundle"
          mkdir release-files
          case "${{ runner.os }}" in
            Windows)
              cp "$BUNDLE/nsis/Refract_${VERSION}_x64-setup.exe" release-files/Refract-Windows-x64.exe
              cp "$BUNDLE/nsis/Refract_${VERSION}_x64-setup.exe.sig" release-files/Refract-Windows-x64.exe.sig
              ;;
            macOS)
              case "${{ runner.arch }}" in
                ARM64) bundle_arch=aarch64; alias_arch=arm64 ;;
                X64) bundle_arch=x64; alias_arch=x64 ;;
                *) exit 1 ;;
              esac
              cp "$BUNDLE/dmg/Refract_${VERSION}_${bundle_arch}.dmg" "release-files/Refract-macOS-${alias_arch}.dmg"
              cp "$BUNDLE/macos/Refract.app.tar.gz" "release-files/Refract-macOS-${alias_arch}.app.tar.gz"
              cp "$BUNDLE/macos/Refract.app.tar.gz.sig" "release-files/Refract-macOS-${alias_arch}.app.tar.gz.sig"
              ;;
            Linux)
              for kind in appimage deb rpm; do
                files=("$BUNDLE/$kind/"*."${kind/appimage/AppImage}")
                test "${#files[@]}" -eq 1
                case "$kind" in
                  appimage) name=Refract-Linux-x86_64.AppImage ;;
                  deb) name=Refract-Linux-amd64.deb ;;
                  rpm) name=Refract-Linux-x86_64.rpm ;;
                esac
                cp "${files[0]}" "release-files/$name"
                cp "${files[0]}.sig" "release-files/$name.sig"
              done
              ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: release-files/*
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  finalize:
    name: Prepare complete release draft
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-files
          merge-multiple: true
      - name: Generate notes and complete updater manifest
        run: |
          python3 -B packaging/scripts/release.py notes "$TAG" > release-notes.md
          python3 -B packaging/scripts/release.py manifest "$TAG" release-files > latest.json
      - name: Create or reuse the unpublished draft
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" > releases.json
          id=$(python3 -B packaging/scripts/release.py draft "$TAG" releases.json)
          if [[ -z "$id" ]]; then
            gh release create "$TAG" --draft --verify-tag --title "Refract $TAG" --notes-file release-notes.md
          fi
      - name: Upload final assets only
        run: |
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          files=(release-files/*)
          payloads=()
          for file in "${files[@]}"; do
            [[ "$file" == *.sig ]] || payloads+=("$file")
          done
          gh release upload "$TAG" "${payloads[@]}" --clobber
          gh release upload "$TAG" latest.json --clobber
          mkdir verify-manifest
          gh release download "$TAG" --pattern latest.json --dir verify-manifest
          cmp latest.json verify-manifest/latest.json
          gh release view "$TAG" --json assets,isDraft > final-release.json
          python3 -B packaging/scripts/release.py verify "$TAG" final-release.json
          printf '## %s ready\n\nReview the completed draft, then click **Publish release**.\n' "$TAG" >> "$GITHUB_STEP_SUMMARY"
