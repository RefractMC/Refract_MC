name: Regression Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: Linux x64
            os: ubuntu-latest
          - name: macOS ARM
            os: macos-latest
          - name: macOS Intel
            os: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter @refract/renderer typecheck
      - run: pnpm --filter @refract/renderer test
      - run: pnpm check:contracts
      - run: pnpm --filter @refract/tauri-poc build:real
      - name: Rust formatting
        working-directory: apps/tauri/src-tauri
        run: cargo fmt --check
      - name: Rust check
        working-directory: apps/tauri/src-tauri
        run: cargo check --locked
      - name: Rust regression tests
        working-directory: apps/tauri/src-tauri
        run: cargo test --locked
