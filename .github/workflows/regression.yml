name: Regression Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: Linux x64
            os: ubuntu-latest
          - name: macOS ARM
            os: macos-latest
          - name: macOS Intel
            os: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - name: Package metadata checks
        if: runner.os == 'Linux'
        run: |
          python3 -B -m unittest discover -s packaging/scripts -p 'test_*.py'
          python3 -B packaging/scripts/validate-packages.py
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri/src-tauri
          # PR caches are scoped to refs/pull/N/merge and can never be restored
          # by main or other PRs, so they only consume the 10 GB repo quota.
          # PRs still restore the main cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter @refract/renderer typecheck
      - run: pnpm --filter @refract/renderer test
      - run: pnpm check:contracts
      - run: pnpm --filter @refract/tauri-poc build:real
      - name: Rust formatting
        working-directory: apps/tauri/src-tauri
        run: cargo fmt --check
      # `cargo test` compiles every target `cargo check` would (the crate has no
      # cfg(not(test)) code), so a separate check step only repeats work.
      - name: Rust regression tests
        working-directory: apps/tauri/src-tauri
        run: cargo test --locked
