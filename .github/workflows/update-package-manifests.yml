name: Update package manifests

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag (for example, v1.3.4)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set release tag
        id: release
        shell: bash
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$EVENT_TAG}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable vMAJOR.MINOR.PATCH tag without leading zeros or suffixes." >&2
            exit 1
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Package metadata regression tests
        run: python3 -B -m unittest discover -s packaging/scripts -p 'test_*.py'

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Refresh and validate package metadata
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          python3 -B packaging/scripts/update-packages.py "$RELEASE_TAG"
          python3 -B packaging/scripts/validate-packages.py

      - name: Open package metadata pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/package-manifests-${{ steps.release.outputs.tag }}
          delete-branch: true
          commit-message: "chore(packaging): update manifests for ${{ steps.release.outputs.tag }}"
          title: "chore(packaging): update manifests for ${{ steps.release.outputs.tag }}"
          body: |
            Refresh Homebrew, Scoop, Chocolatey, and nixpkgs metadata from the published release.

            Validation ran with the package metadata regression tests, Nix source/dependency hash verification, and `packaging/scripts/validate-packages.py`.
