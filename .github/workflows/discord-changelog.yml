name: Announce changelog to Discord

# Posts the matching CHANGELOG.md section to a Discord channel whenever a release
# is published. Uses a channel webhook, no Discord app/bot
# needed. Set the repo secret DISCORD_WEBHOOK_URL to the channel's webhook URL
# (Discord: Channel → Edit → Integrations → Webhooks → New Webhook → Copy URL).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable release tag to announce (e.g. v1.1.4)"
        required: true

permissions:
  contents: read

jobs:
  announce:
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Keep the helper on the default branch and read notes from the release tag.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Post changelog to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "::error::DISCORD_WEBHOOK_URL secret is not set"
            exit 1
          fi

          python3 -B packaging/scripts/release.py discord "$TAG" --url "$RELEASE_URL" \
            > "$RUNNER_TEMP/discord-payload.json"
          code="$(curl -sS -o "$RUNNER_TEMP/discord-response.txt" -w '%{http_code}' \
            -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/discord-payload.json" "$DISCORD_WEBHOOK_URL")"
          echo "Discord responded with HTTP $code"
          cat "$RUNNER_TEMP/discord-response.txt"
          case "$code" in
            2??) echo "Posted changelog for $TAG" ;;
            *)  echo "::error::Discord webhook failed (HTTP $code)"; exit 1 ;;
          esac
