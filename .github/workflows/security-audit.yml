name: Security Audit

on:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Both audits read only the lockfiles, so nothing is installed or built.
      # Compilation and typechecking are covered by the Regression Checks workflow.
      - name: Production JavaScript dependency audit
        run: pnpm audit --prod

      - name: JavaScript dependency audit
        # No patched picomatch release exists. It is confined to build tooling
        # with repository-owned globs; the production audit above has no ignore.
        # Review by 2026-12-17 or the next release. See SECURITY.md.
        # pnpm 11 --ignore records configuration; audit again to check every
        # other advisory. This modifies only the disposable CI checkout.
        run: |
          pnpm audit --ignore GHSA-fc5q-39xc-vjpf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm audit

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Rust dependency audit
        working-directory: apps/tauri/src-tauri
        # glib is pulled in by Tauri's Linux WebKitGTK/GTK3 backend through wry.
        # The patched glib line starts at 0.20, but the current upstream GTK3
        # stack is capped at glib 0.18.5, so this cannot be fixed directly here.
        # crypto-bigint 0.5 is required by Stronghold's k256/elliptic-curve stack.
        # Refract uses its key-value store and snapshots, not curve procedures.
        # Review by 2026-12-17 or the next upstream release; see SECURITY.md.
        run: >-
          cargo audit
          --ignore RUSTSEC-2024-0429
          --ignore RUSTSEC-2026-0387
